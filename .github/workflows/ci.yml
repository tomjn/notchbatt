name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Installs the swiftlint version declared in mise.toml (parity with local dev).
      - uses: jdx/mise-action@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Lint
        run: mise run lint
